# 淘金币自动化脚本配置文件
# 任务名「包含」下列关键词即命中。改行为优先改本文件，不要重复写同一个键。

# 应用配置
app:
  package_name: "com.taobao.taobao"  # 淘宝应用包名
  launch_wait_time: 3  # 启动应用后等待时间（秒）

# 任务配置（当前仅保留淘金币）
task:
  coin:
    target_count: 10  # 本轮要完成多少个任务闭环（点进→做完→回到列表 = 1 次）

    # ---------- 放行（白名单，优先于跳过）----------
    allow_keywords:
      - "好物沉浸看"
      - "沉浸看"
      - "沉浸浏览"
      - "去逛UC"
      - "UC送红包"
      - "淘金币趣味课堂"
      - "趣味课堂"
      - "搜一搜"

    # ---------- 跳过（不点击）----------
    # 完整名单，代码内不再另藏一份。要做某个任务：从本列表删掉对应词。
    # 不要用过宽的词：签到、拍立淘（去签到领红包 / 拍立淘逛宝贝要做）
    skip_keywords:
      # 拉人 / 分享 / 助力
      - "拉好友"
      - "拉1人助力"
      - "邀请好友"
      - "每拉"
      - "分享"
      - "助力"
      # 下单 / 花钱
      - "下单"
      - "下单即得"
      - "下单立得"
      - "下单得肥料"
      - "领券下单"
      - "搜索兴趣商品下单"
      - "买精选商品"
      - "购买"
      - "加购"
      - "购物"
      - "充值"
      - "去支付"
      - "完成支付"
      - "全场3元3件"
      - "3元抢3件包邮到家"
      - "1元抢爆款好货"
      - "好货限时直降"
      - "淘宝秒杀"
      - "买"
     
      # 入会 / 开通
      - "入会"
      - "加入会员"
      - "开卡"
      - "开通"
      - "88VIP"
      # 游戏
      - "农场小游戏"
      - "砸蛋"
      - "消消乐"
      - "玩消消乐"
      - "连连消"
      - "玩一玩"
      - "玩任意游戏"
      - "游戏"
      - "抽奖"
      - "拍一拍"
      # 直播
      - "直播间"
      - "看直播"
      - "进直播"
      # 其他需人工
      - "抢红包"
      - "固定入口"
      - "大众点评"
      - "蚂蚁新村"
      - "添加签到神器"
      - "首页回访"
      - "百亿外卖"
      - "玩趣味游戏得大额体力"
      - "天猫积分换体力"
      - "头条刷热点"
      - "一淘签到"
      - "收藏商品"
      - "关注店铺"
      - "实名"
      - "借钱"
      - "理财"
      - "信用卡"
      - "天天"
      - "头条"

    # ---------- 趣味课堂（点进去随机点一个选项再返回）----------
    quiz_keywords:
      - "趣味课堂"
      - "淘金币趣味课堂"

# 操作配置
operation:
  max_wait_duration: 35  # 任务完成弹窗等待上限（秒），读不到"浏览XX秒"要求时的兜底超时
  required_buffer: 8  # 读到的任务要求秒数 + 此缓冲 = 超时上限
  human_swipe:  # 模拟真人滑动（幅度大，速度随机；越短越快）
    duration_min: 0.06  # 最快（秒）；可再快
    duration_max: 0.14  # 最慢不超过约当前手感
    distance_ratio_min: 0.68  # 滑动距离占屏高比例下限
    distance_ratio_max: 0.88  # 滑动距离占屏高比例上限
    steps_min: 5  # 曲线插值点数（太多会拖慢）
    steps_max: 8
    jitter_probability: 0.08  # 微抖动概率
    interval_seconds: 0  # 两次滑动之间的间隔（秒）；0=滑完立刻下一轮
  wait_between_tasks: 2  # 任务间等待时间（秒）
  # 列表内可直接领的任务（如「任务到访得金币」）按钮文案是「领取奖励」，不是「去完成」
  direct_claim_btn_keywords:
    - "领取奖励"
    - "去领取"
  # 搜一搜：优先随机点搜索栏下方提示词；找不到提示词才用这个兜底
  search_keyword: "笔记本电脑"

  # ---------- 淘金币首页：同一颗主按钮 ----------
  # 未签到文案 = 签到领金币；点完后这颗按钮变成赚更多金币，再点才进任务列表。
  # 日历上往日的「已签到」不是这颗按钮，不要拿来判断今天。
  checkin_keywords:
    - "立即签到"
    - "今日签到"
    - "签到领金币"
  checkin_done_keywords:
    - "已签到"
  coin_entry_keywords:
    - "赚更多金币"
  # 主按钮文案里若包含这些，不当首页签到（避免点到「去签到领红包」）
  checkin_ignore_in_text:
    - "领红包"
    - "神器"
    - "已签"

  # ---------- 任务完成提示（右下角气泡 / 顶栏 / 弹窗）----------
  # 文案「包含」即算完成。必须带「已」，不要写单独的「完成任务」
  # （否则会把倒计时「浏览15秒完成任务」误判成已经完成）
  completion_keywords:
    - "已完成任务"
    - "任务已完成"
    - "已完成浏览"
    - "浏览已完成"
    - "浏览完成"
    - "已完成"
    - "已得"
    - "已到账"
    - "已获得"
    - "金币已到账"
    - "领取成功"
    - "已成功领取奖励"
    - "浏览0秒"
    - "浏览 0 秒"

  # ---------- 秒返 / 外跳（点进去后立刻按返回策略回淘宝，不长时间浏览）----------
  # 仅放「真外跳 App」：支付宝、闲鱼、饿了么等。
  # 淘宝内子页需下滑浏览的任务（如「查看我的会员等级」）不要放这里，走默认浏览滑动。
  quick_return_keywords:
    - "支付宝"
    # 会员等级：跳转后需下滑等待，不是秒返
    - "蚂蚁森林"
    - "蚂蚁庄园"
    - "庄园"
    - "芭芭农场"
    - "芝麻信用"
    - "百度"
    - "闲鱼"
    - "神奇海洋"
    - "淘宝特价版"
    - "点淘"
    - "饿了么"
    - "微博"
    - "直播"
    - "看小说"
    - "菜鸟"
    - "菜鸟裹裹"
    - "斗地主"
    - "领肥料礼包"
    - "福气提现金"
    - "淘宝闪购"
    - "闪购"
    - "百亿补贴"
    - "天猫"
    - "飞猪"
    - "盒马"
    - "口碑"
    - "高德"
    - "钉钉"
    - "优酷"
    - "淘特"
    # 金豆 / 盲盒类外跳（可继续追加同类活动名）
    - "金豆夺宝"
    - "0元领盲盒"
    - "领盲盒"
  quick_return_settle_seconds: 3  # 点击后等待跳转完成的秒数
  # 外跳后可能弹出的广告/授权，点这些关掉再返回
  popup_close_keywords:
    - "关闭广告"
    - "跳过广告"
    # 不要写单独的「关闭」：任务列表右上角叉叉就是「关闭」，会把列表关掉
    - "我知道了"
    - "知道了"
    - "取消"
    - "暂不"
    - "以后再说"
    - "坚持退出"
    - "放弃福利"
    - "允许"
    - "始终允许"
    - "同意并继续"
  # 没有「关闭」文字、只有叉叉时：按描述 / 资源 id / 右上角小图标点掉
  popup_close_desc_keywords:
    - "关闭广告"
    - "关闭按钮"
  popup_close_id_patterns:
    - "close"
    - "iv_close"
    - "btn_close"
    - "img_close"
    - "guanbi"
  popup_x:
    enabled: false   # 禁止猜右上角小图标，任务页会被连点乱点
    min_size: 28
    max_size: 160
    right_ratio: 0.55
    top_ratio: 0.50
  # 后台 dump 猜叉叉会误点，已关闭；文字「关闭/我知道了」仍由监视器处理
  popup_watch_enabled: false
  popup_watch_interval: 3

# 重试配置
retry:
  max_back_times: 10  # 最大后退次数
  min_back_times_search: 2  # 搜索任务最小后退次数
  min_back_times_normal: 1  # 普通任务最小后退次数
  max_no_task_count: 3  # 连续未找到任务的最大次数
  max_stale_progress_attempts: 2  # 同一 (x/y) 连续 N 次无变化则本轮自动跳过（如卡住的 0/1）
  navigation_max_attempts: 5  # 导航到任务界面的最大尝试次数

# 调试配置
debug:
  print_buttons: true  # 是否打印页面按钮信息（调试用）
  verbose: true  # 是否输出详细日志
